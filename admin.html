<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administración | Graduación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{padding:25px}.admin{max-width:1100px;margin:auto}.admin-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:25px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:25px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:20px}.stat b{display:block;font-size:30px}.stat span{color:var(--muted);font-size:12px}.table-wrap{background:white;border:1px solid var(--line);border-radius:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.top-actions{display:flex;gap:8px}.secondary-btn{border:0}.status{font-size:12px;color:var(--muted);margin:0 0 18px}.error{color:#a33}@media(max-width:650px){.stats{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="admin">
  <div class="admin-head">
    <div><div class="section-tag">PANEL DE GRADUACIÓN</div><h1 style="font-size:42px;margin:4px 0">Confirmaciones</h1></div>
    <div class="top-actions"><button id="refreshBtn" class="secondary-btn">Actualizar</button><button id="exportBtn" class="secondary-btn">Exportar CSV</button></div>
  </div>

  <p id="status" class="status">Cargando confirmaciones desde Google Sheets...</p>

  <div class="stats">
    <div class="stat"><b id="statResponses">0</b><span>Confirmaciones</span></div>
    <div class="stat"><b id="statGuests">0</b><span>Personas confirmadas</span></div>
    <div class="stat"><b id="statMenus">0</b><span>Menús registrados</span></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Nombre</th><th>Teléfono</th><th>Personas</th><th>Menú</th><th>Observaciones</th><th>Confirmado</th><th>Fecha</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script src="config.js"></script>
<script>
const cfg = window.APP_CONFIG || {};
const statusEl = document.getElementById("status");
let records = [];

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function formatDate(value){
  if(!value) return "—";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? esc(value) : d.toLocaleString("es-HN");
}

function load(){
  if(!cfg.GOOGLE_SHEETS_URL){
    statusEl.textContent = "No está configurada la URL de Google Sheets.";
    statusEl.classList.add("error");
    return;
  }

  statusEl.textContent = "Cargando confirmaciones desde Google Sheets...";
  statusEl.classList.remove("error");

  const callback = "googleSheetsAdmin_" + Date.now();
  const script = document.createElement("script");
  const timeout = setTimeout(() => {
    cleanup();
    statusEl.textContent = "No se pudo cargar Google Sheets. Revisa la implementación del Web App.";
    statusEl.classList.add("error");
  }, 15000);

  window[callback] = function(response){
    clearTimeout(timeout);
    cleanup();

    if(!response || !response.ok){
      statusEl.textContent = response?.message || "No se pudieron cargar las confirmaciones.";
      statusEl.classList.add("error");
      return;
    }

    records = Array.isArray(response.records) ? response.records : [];
    render();
    statusEl.textContent = `Última actualización: ${new Date().toLocaleString("es-HN")}`;
  };

  function cleanup(){
    delete window[callback];
    script.remove();
  }

  script.onerror = function(){
    clearTimeout(timeout);
    cleanup();
    statusEl.textContent = "No se pudo conectar con Google Sheets.";
    statusEl.classList.add("error");
  };

  script.src = cfg.GOOGLE_SHEETS_URL + "?action=list&callback=" + encodeURIComponent(callback) + "&_=" + Date.now();
  document.body.appendChild(script);
}

function render(){
  document.getElementById("statResponses").textContent = records.length;
  document.getElementById("statGuests").textContent = records.reduce((sum,r)=>sum + Number(r.guests || 0),0);
  document.getElementById("statMenus").textContent = records.filter(r=>r.menu).length;

  document.getElementById("rows").innerHTML = records.length
    ? records.map(r=>`<tr>
        <td>${esc(r.name)}</td>
        <td>${esc(r.phone || "—")}</td>
        <td>${Number(r.guests || 0)}</td>
        <td>${esc(r.menu || "—")}</td>
        <td>${esc(r.notes || "—")}</td>
        <td>${esc(r.confirmed || "—")}</td>
        <td>${formatDate(r.created_at)}</td>
      </tr>`).join("")
    : `<tr><td colspan="7" style="text-align:center;padding:30px">Aún no hay confirmaciones.</td></tr>`;
}

document.getElementById("refreshBtn").addEventListener("click", load);

document.getElementById("exportBtn").addEventListener("click",()=>{
  const headers=["Nombre","Telefono","Personas","Menu","Observaciones","Confirmado","Fecha"];
  const lines=[headers,...records.map(r=>[r.name,r.phone||"",r.guests,r.menu||"",r.notes||"",r.confirmed||"",r.created_at])]
    .map(row=>row.map(x=>`"${String(x ?? "").replaceAll('"','""')}"`).join(","));
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="confirmaciones-graduacion.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

load();
</script>
</body>
</html>
